services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: process_control
      POSTGRES_USER: process
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process -d process_control"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: process_control_test
      POSTGRES_USER: process
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process -d process_control_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      INTERNAL_NETWORKS: ${INTERNAL_NETWORKS:-127.0.0.1/32,::1/128}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
    ports:
      - "5173:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web_tests:
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./apps/web:/app
    entrypoint: ["/bin/sh", "-c", "npm install && npm test"]

  tests:
    build:
      context: ./apps/api
    profiles: ["test"]
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://process:${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD is required}@db_test:5432/process_control_test
      JWT_SECRET: ${TEST_JWT_SECRET:?TEST_JWT_SECRET is required}
    depends_on:
      db_test:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "alembic upgrade head && pytest -q -p no:cacheprovider"]

volumes:
  postgres_data:
  postgres_test_data:
